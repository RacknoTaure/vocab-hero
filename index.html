/* battle */
.battleLayout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:10px;align-items:start}.battleSide{min-width:0}.hud{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:linear-gradient(135deg,#102f4c,#194e6c);border:2px solid #ddb55a;border-radius:15px;padding:8px 10px;color:#fff;box-shadow:0 4px 0 #092137;margin-bottom:8px}.heroMini{display:flex;align-items:center;gap:8px}.avatarMini{font-size:27px}.xpbar,.hpbar{height:7px;background:#ffffff24;border-radius:99px;overflow:hidden}.xpfill{height:100%;background:linear-gradient(90deg,#55d88d,#e8c65c)}.arena{position:relative;min-height:270px;border:3px solid #6a4b2c;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#b8dff3 0 45%,#b5d994 46%,#8fc174 100%);box-shadow:0 6px 0 #53391e,0 11px 20px #0002}.arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:radial-gradient(ellipse at center,#6da65d55,transparent 66%)}.battleStage{position:relative;z-index:2;display:grid;grid-template-columns:1fr .8fr 1fr;align-items:end;height:270px;padding:12px}.charZone,.enemyZone{text-align:center;position:relative}.heroStack{position:relative;display:inline-block}.hero{font-size:74px;line-height:1;filter:drop-shadow(0 4px 2px #0003)}.weaponVisual{position:absolute;font-size:44px;right:-32px;bottom:7px;transform:rotate(-25deg);filter:drop-shadow(0 3px 2px #0004)}.companionVisual{position:absolute;font-size:36px;left:-40px;bottom:2px;filter:drop-shadow(0 3px 2px #0003)}.aura{position:absolute;inset:-10px;border-radius:50%;opacity:.35;filter:blur(6px);z-index:-1}.enemy{font-size:72px;filter:drop-shadow(0 4px 2px #0003)}.nameplate{font-size:11px;font-weight:950;background:#ffffffc9;border-radius:999px;padding:3px 7px;display:inline-block}.enemyHp{height:11px;background:#173044;border:2px solid #fff;border-radius:99px;overflow:hidden;margin-bottom:5px}.enemyHp i{display:block;height:100%;background:linear-gradient(90deg,#ff514a,#ffae43);transition:.25s width}.centerHud{text-align:center;align-self:center}.battleMsg{display:inline-block;max-width:220px;background:#12314e;color:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.power{font-size:11px;font-weight:950;margin-top:6px}.fx{position:absolute;z-index:5;pointer-events:none;font-size:62px;left:47%;top:35%;opacity:0}.fx.go{animation:fxFly .55s ease-out}@keyframes fxFly{0%{opacity:0;transform:translate(-80px,30px) scale(.4) rotate(-25deg)}35%{opacity:1}100%{opacity:0;transform:translate(125px,-10px) scale(1.5) rotate(25deg)}}.heroAttack{animation:heroAttack .35s}.enemyHit{animation:enemyHit .35s}@keyframes heroAttack{50%{transform:translateX(22px) scale(1.06)}}@keyframes enemyHit{50%{transform:translateX(10px) rotate(8deg)}}

.medalBadge{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:999px;background:#fff3bd;color:#74530b;font-size:9px;font-weight:950;border:1px solid #e7be54}
.arena{background-size:cover;background-position:center}
.arena:after{background:linear-gradient(180deg,transparent 0 48%,rgba(30,60,35,.10) 75%,rgba(22,39,28,.22) 100%)}
.arena.shadowArrival{animation:arenaShake .7s ease}
.arena.shadowArrival:before{content:"";position:absolute;inset:0;z-index:4;background:radial-gradient(circle at 78% 55%,rgba(92,42,130,.55),rgba(14,9,24,.62) 42%,transparent 72%);animation:shadowPulse .9s ease forwards;pointer-events:none}
.enemy.shadowSpawn{animation:shadowSpawn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes arenaShake{20%{transform:translateX(-3px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes shadowPulse{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes shadowSpawn{0%{opacity:0;transform:scale(.2) rotate(-20deg);filter:blur(10px)}55%{opacity:1;transform:scale(1.35) rotate(6deg);filter:blur(0)}100%{transform:scale(1)}}
.dangerText{color:#ffdf74!important;text-shadow:0 0 10px #ff6b4a}

.resultActions button{margin:0}
.result .shopAction{background:#173b58}

.medalBig{font-size:52px;filter:drop-shadow(0 4px 4px #a06913aa);animation:medalPop .55s ease-out}
@keyframes medalPop{0%{transform:scale(.2) rotate(-30deg)}75%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1)}}
.fireworks{position:absolute;inset:0;pointer-events:none}
.fireworks span{position:absolute;font-size:26px;animation:firework 1.35s ease-out infinite}
.fireworks span:nth-child(1){left:8%;top:14%;animation-delay:.05s}.fireworks span:nth-child(2){left:82%;top:10%;animation-delay:.35s}.fireworks span:nth-child(3){left:15%;top:66%;animation-delay:.65s}.fireworks span:nth-child(4){left:78%;top:64%;animation-delay:.9s}.fireworks span:nth-child(5){left:50%;top:4%;animation-delay:.5s}

function unitProgress(u){let a=VOCAB.filter(v=>v.unit===u),safe=a.filter(v=>skillState(v).safe).length;return {safe,total:a.length,pct:a.length?Math.round(safe/a.length*100):0,mastered:rpg.bosses.includes(u)}}function totalSafe(){return VOCAB.filter(v=>skillState(v).safe).length}function world(u){return WORLD[u]}
function migrateCoins(){
  if(!rpg.migrationV5){
    let safe=VOCAB.filter(v=>skillState(v).safe);
    for(const v of safe)if(!rpg.coinWords.includes(v.id)){
      rpg.coinWords.push(v.id);
      if(!rpg.coinFirstWords.includes(v.id))rpg.coinFirstWords.push(v.id);
      rpg.coins+=5
    }
    rpg.migrationV5=true
  }
  if(!rpg.migrationV51){
    for(const id of rpg.coinWords)if(!rpg.coinFirstWords.includes(id))rpg.coinFirstWords.push(id);
    for(const v of VOCAB){
      let s=state.words[v.id];
      if(s&&s.de&&s.de.r>0&&!rpg.coinWords.includes(v.id)&&!rpg.coinFirstWords.includes(v.id)){

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function weighted(pool,problem=false){let a=[];pool.forEach(v=>{let s=wstate(v.id),w=s.ed.w+s.de.w+s.sp.w,r=s.ed.r+s.de.r+s.sp.r,n=problem?Math.max(1,w*2):Math.max(1,1+w*2-Math.floor(r/4));for(let i=0;i<n;i++)a.push(v)});return shuffle(a).slice(0,12)}
function startUnit(u){activate(u);startSession(shuffle(VOCAB.filter(v=>v.unit===u)).slice(0,12),`${world(u).e} ${world(u).n}`,u,"normal")}function startReview(){let p=VOCAB.filter(v=>state.activeUnits.includes(v.unit));if(!p.length)return alert("Starte zuerst eine Unit.");startSession(weighted(p),"Trainingsarena",null,"normal")}function startProblems(){let p=VOCAB.filter(v=>{let s=state.words[v.id];return s&&(s.ed.w+s.de.w+s.sp.w)>0});if(!p.length)return alert("Noch keine Problemwörter – stark! 🎉");startSession(weighted(p,true),"Monsterjagd",null,"normal")}function startElite(u){if(!eliteReady(u))return;startSession(shuffle(VOCAB.filter(v=>v.unit===u)).slice(0,12),`ELITE · ${world(u).n}`,u,"elite")}function startBoss(u){if(!bossReady(u))return showBossRequirements(u);startSession(shuffle(VOCAB.filter(v=>v.unit===u)).slice(0,12),`BOSS · ${world(u).n}`,u,"boss")}

function norm(s){
  return(s||"").toLowerCase().trim()

    .replace(/\s+/g," ").trim()
}

function slashVariants(s){
  s=(s||"").trim();
  if(!s)return[];
  if(/\s+\/\s+/.test(s))return uniq(s.split(/\s+\/\s+/).flatMap(x=>slashVariants(x)));
  let toks=s.split(/\s+/),vars=[""];
  for(const tok of toks){
    let opts=[tok];
    if(tok.includes("/")){
      let ps=tok.split("/"),base=ps[0];
      opts=[base];
      for(let i=1;i<ps.length;i++){
        let q=ps[i]; if(!q)continue;
        if(q.startsWith("-")){
          // Rare compound shorthand is handled by BOOK_EXTRAS; keep a conservative fallback.
          opts.push(base+q.slice(1));
        }else if(base.toLowerCase().endsWith("bester") && /^beste/.test(q.toLowerCase())){
          opts.push(base.slice(0,-6)+q);
        }else if(q.length<=2){
          opts.push(base+q);
        }else if(q.length>=Math.max(3,base.length-2)){
          opts.push(q);
        }else{
          opts.push(base+q);
        }
      }
    }
    let next=[];
    for(const v of vars)for(const o of opts)next.push((v+" "+o).trim());
    vars=next
  }

}

function expandOptional(s){
  s=(s||"").trim();
  if(!s)return[];
  if(BOOK_EXTRAS[s])return uniq(BOOK_EXTRAS[s]);

  let eq=s.match(/^(.*?)\s*\(=\s*([^)]+)\)\s*(.*)$/);
  if(eq)return uniq([`${eq[1]} ${eq[3]}`,`${eq[2]} ${eq[3]}`].flatMap(x=>expandOptional(x)));

  // Grammar notes: base form always valid; listed plural also counts as a valid book form.
  let gram=s.match(/^(.*?)\((pl\s+([^)]+)|pl|no pl)\)(.*)$/i);
  if(gram){
    let out=[`${gram[1]} ${gram[4]}`];
    if(gram[3]&&gram[4].trim()==="")out.push(gram[3]);
    return uniq(out.flatMap(x=>expandOptional(x)))
  }

  let m=s.match(/^(.*?)\(([^()]*)\)(.*)$/);
  if(!m){
    let out=slashVariants(s);
    return uniq(out.flatMap(x=>[x,x.replace(/-$/,"")]))
  }

  let before=m[1],inside=m[2].trim(),after=m[3];
  if(inside==="..."||NOTE_WORDS.has(inside.toLowerCase()))
    return uniq(expandOptional(before+after));

  let variants=[before+after];

  // Past/irregular form in English book notation: "to freeze (froze)".
  let standaloneInflection=/^to\s+/i.test(before.trim()) && !after.trim() && inside && !PREP_WORDS.has(inside.toLowerCase());
  if(standaloneInflection)variants.push(inside);

  // Contraction shown as an alternative: "there is (there's)".
  let standaloneContraction=!after.trim() && inside.includes("'");
  if(standaloneContraction)variants.push(inside);

  if(standaloneInflection||standaloneContraction){
    return uniq(variants.flatMap(x=>expandOptional(x)))
  }else if(inside.includes("/") && inside.split("/").every(x=>x.startsWith("-"))){
    for(const suffix of inside.split("/"))variants.push(before+suffix.slice(1)+after)
  }else if(inside.endsWith("-")){
    variants.push(before+inside.slice(0,-1)+after.replace(/^-?/,""))
  }else if(before.endsWith("-")){
    variants.push(before.slice(0,-1)+inside+after)
  }else{
    variants.push(before+inside+after)
  }

  // A one-word synonym/plural in brackets may itself be a listed valid form.
  if(!after.trim() && before.trim().split(/\s+/).length===1 &&
     inside && !PREP_WORDS.has(inside.toLowerCase()) && !NOTE_WORDS.has(inside.toLowerCase()) &&
     !inside.includes("-") && !inside.includes("/")){
    variants.push(inside)
  }

  return uniq(variants.flatMap(x=>expandOptional(x)))
}

function splitTop(s){
  let out=[];
  (s||"").split(/\s*;\s*/).forEach(p=>{
    if(/\s+\/\s+/.test(p))out.push(...p.split(/\s+\/\s+/));
    else out.push(p)
  });
  return out
}
function englishVariants(raw){
  let out=[];
  splitTop(raw).forEach(p=>expandOptional(p).forEach(x=>{
    out.push(x);
    let n=norm(x);
    if(/^to\s+/.test(n))out.push(n.replace(/^to\s+/,""))
  }));
  return uniq(out.flatMap(x=>[x,x.replace(/-$/,"")]))
}
function germanVariants(raw){
  let out=[];
  splitTop(raw).forEach(p=>p.split(/\s*,\s*/).forEach(piece=>{
    if(BOOK_EXTRAS[piece])out.push(...BOOK_EXTRAS[piece]);
    else expandOptional(piece).forEach(x=>out.push(x))
  }));
  return uniq(out.map(x=>x.replace(/^hier\s*:\s*/,"").replace(/-$/,"")))
}
function deStem(s){s=norm(s).replace(/\b(der|die|das|ein|eine|einen|einem|einer|zu)\b/g,"").trim();if(s.length<5)return s;return s.replace(/(etest|test|est|ern|em|en|er|es|e|st|t)$/,"")}function lev(a,b){let m=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}function close(a,b){let d=lev(a,b),L=Math.max(a.length,b.length);return(L>=5&&d===1)||(L>=9&&d===2)}function evaluate(ans,v,dir){
  let a=norm(ans);if(!a)return{kind:"bad"};
  if(dir==="de"){
    let c=englishVariants(v.en),aa=a.replace(/^to\s+/,""),ac=compact(aa);
    if(c.some(x=>{
      let xx=norm(x).replace(/^to\s+/,"");
      return xx===aa||compact(xx)===ac
    }))return{kind:"ok"};
    if(c.some(x=>close(aa,norm(x).replace(/^to\s+/,""))))return{kind:"near"};
    return{kind:"bad"}
  }else{
    let c=germanVariants(v.de),ac=compact(a);
    if(c.some(x=>norm(x)===a||compact(x)===ac||deStem(x)===deStem(a)))return{kind:"ok"};
    if(c.some(x=>close(a,norm(x))))return{kind:"near"};
    return{kind:"bad"}
  }
}

    return Math.floor(prev*(x.u<=10?.15:.30))
  }
  if(x.type==="special"){
    if(x.u<=6)return 0;
    return Math.floor(prev*(x.u<=10?.22:.36))
  }
  if(x.type==="companion"||x.type==="heart"){
    if(x.u<=6)return 0;
    return Math.floor(prev*(x.u<=10?.18:.30))
  }
  return 0
}

function itemGate(x){
  let p=unitProgress(x.u),k=knowledgeReqFor(x),m=materialReq(x),
      specialIndex=x.type==="special"?SPECIALS.findIndex(s=>s.u===x.u):-1,
      previousSpecial=specialIndex<=0||rpg.specialLevel>=specialIndex,
      firstWin=x.type!=="weapon"||firstEnglishWins(x.u)>=1,
      needPct=effectivePct(x);
  return{
    active:state.activeUnits.includes(x.u),
    progress:p.pct>=needPct,
    firstWin,
    needPct,
    knowledge:totalSafe()>=k,
    coins:rpg.coins>=x.p,
    crystals:rpg.crystals>=m.crystals,
    seals:rpg.seals>=m.seals,
    previousSpecial,k,m
  }
}
function showShop(u){shopUnit=u||shopUnit||Math.max(1,...state.activeUnits);renderShop();screens("shop")}
function renderShop(){
  document.getElementById("shopCoins").innerHTML=`<span class="goldCoin"></span>${rpg.coins} Gold`;
  document.getElementById("shopMats").textContent=`💎 ${rpg.crystals} · 🛡️ ${rpg.seals} · 🔥 ${rpg.cores}`;
  let tabs=document.getElementById("shopTabs");tabs.innerHTML="";
  for(let u=1;u<=15;u++){
    let b=document.createElement("button");b.className="unitTab "+(u===shopUnit?"sel":"");
    b.textContent=`${world(u).e} ${u}`;b.onclick=()=>{shopUnit=u;renderShop()};tabs.appendChild(b)
  }
  let g=document.getElementById("shopGrid");g.innerHTML="";
  for(const x of shopItems(shopUnit)){
    let gate=itemGate(x),owned=itemOwned(x),req=[];
    if(!gate.active)req.push("Unit noch nicht aktiv");
    if(x.type==="weapon"&&!gate.firstWin)req.push("1 richtige Englisch-Antwort");
    if(x.type!=="weapon"&&!gate.progress&&gate.needPct>0)req.push(`${gate.needPct}% Unit-Fortschritt`);
    if(!gate.knowledge&&gate.k)req.push(`${gate.k} Wörter insgesamt sicher`);
    if(!gate.previousSpecial)req.push("vorheriges Spezial-Upgrade");
    let mr=materialReq(x);
    if(mr.crystals)req.push(`💎 ${mr.crystals}`);
    if(mr.seals)req.push(`🛡️ ${mr.seals}`);
    let can=gate.active&&gate.progress&&gate.firstWin&&gate.knowledge&&gate.coins&&gate.crystals&&gate.seals&&gate.previousSpecial&&!owned,
        d=document.createElement("div");
    d.className="shopItem";
    d.innerHTML=`<div><div class="shopIcon">${x.i}</div><h3>${x.n}</h3><p>${x.desc||""}</p><div class="req">${req.length?"🔒 "+req.join(" · "):"✅ freigeschaltet"}</div></div><button class="buy ${owned?"owned":""}" ${owned||!can?"disabled":""}>${owned?"✓ Besitz":`🪙 ${x.p} kaufen`}</button>`;
    if(owned&&(x.type==="weapon"||x.type==="companion"||x.type==="aura")){
      let b=d.querySelector("button");b.disabled=false;b.textContent=isEquipped(x)?"✓ Ausgerüstet":"Ausrüsten";b.onclick=()=>equipItem(x)
    }else if(can)d.querySelector("button").onclick=()=>buyItem(x);
    g.appendChild(d)
  }
}
function isEquipped(x){return x.type==="weapon"?rpg.equippedWeapon===x.id:x.type==="companion"?rpg.equippedCompanion===x.id:rpg.equippedAura===x.id}function buyItem(x){let gate=itemGate(x),mr=materialReq(x);if(!(gate.active&&gate.progress&&gate.firstWin&&gate.knowledge&&gate.coins&&gate.crystals&&gate.seals&&gate.previousSpecial))return;rpg.coins-=x.p;rpg.crystals-=mr.crystals;rpg.seals-=mr.seals;if(x.type==="special")rpg.specialLevel=Math.max(rpg.specialLevel,SPECIALS.findIndex(s=>s.u===x.u)+1);else{rpg.inventory.push(x.id);if(x.type==="heart")rpg.maxHp++;if(x.type==="weapon")rpg.equippedWeapon=x.id;if(x.type==="companion")rpg.equippedCompanion=x.id;if(x.type==="aura")rpg.equippedAura=x.id}saveRpg();renderShop();renderUnits()}function equipItem(x){if(x.type==="weapon")rpg.equippedWeapon=x.id;if(x.type==="companion")rpg.equippedCompanion=x.id;if(x.type==="aura")rpg.equippedAura=x.id;saveRpg();renderShop()}
function showBossRequirements(u){let p=unitProgress(u),lines=[`${p.pct===100?"✅":"❌"} 100% Wörter sicher`,`${rpg.elites.includes(u)?"✅":"❌"} Elite besiegt`,`${boughtInUnit(u)?"✅":"❌"} mindestens 1 Shop-Upgrade aus Unit ${u}`,`${combatPower()>=bossPowerReq(u)?"✅":"❌"} Kampfkraft ${bossPowerReq(u)} (du: ${combatPower()})`];alert(`Boss-Tor Unit ${u}\n\n`+lines.join("\n"))}
function showProgress(){
  let e=document.getElementById("progressContent");e.innerHTML="";
  for(let u=1;u<=15;u++){
    let p=unitProgress(u),w=world(u),med=(rpg.perfectRuns&&rpg.perfectRuns[u])||0,d=document.createElement("div");d.className="panel";
    d.innerHTML=`<div class="row"><div><b>${w.e} ${w.n} · Unit ${u}</b><div class="note">${p.safe}/${p.total} Wörter sicher · 🏅 ${med} perfekte Runde${med===1?"":"n"}</div></div><div>${p.mastered?"🏆 Boss besiegt":eliteReady(u)?"⚔️ Unit-Elite bereit":bossReady(u)?"👑 Boss bereit":p.pct+"%"}</div></div><div class="unitBar"><i style="width:${p.pct}%"></i></div><div class="note" style="margin-top:7px">Unit-Elite ab 60% · Boss: 100% + Unit-Elite + Shop-Upgrade + ⚔️ ${bossPowerReq(u)}</div>`;
    e.appendChild(d)
  }
  screens("progress")
}
function showAdmin(){let e=document.getElementById("adminContent");e.innerHTML="";for(let u=1;u<=15;u++){let on=state.activeUnits.includes(u),r=document.createElement("div");r.className="row";r.innerHTML=`<div><b>${world(u).e} ${world(u).n} · Unit ${u}</b><div class="note">${VOCAB.filter(v=>v.unit===u).length} Vokabeln</div></div><button class="buy">${on?"Aktiv":"Inaktiv"}</button>`;r.querySelector("button").onclick=()=>toggleUnit(u,on);e.appendChild(r)}screens("admin")}function toggleUnit(u,on){if(on){if(!confirm(`Unit ${u} deaktivieren? Fortschritt bleibt erhalten.`))return;state.activeUnits=state.activeUnits.filter(x=>x!==u)}else state.activeUnits.push(u);state.activeUnits=[...new Set(state.activeUnits)].sort((a,b)=>a-b);save();showAdmin();renderUnits()}function resetAll(){if(!confirm("Wirklich ALLES zurücksetzen?"))return;state=fresh();localStorage.setItem(KEY,JSON.stringify(state));rpg=defaultRpg();localStorage.setItem(RPG_KEY,JSON.stringify(rpg));goHome()}
migrateCoins();refreshTop();renderUnits();goHome();
</script></body></html>
